name: French voice comparison

# Synthesizes the same French passage with every candidate Piper voice and scores it
# (nasal vowels, Whisper word error rate, pace, melody, license). Samples are attached.
on:
  workflow_dispatch:
  push:
    paths:
      - pipeline/voice_compare.py
      - .github/workflows/voices.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -r requirements.txt faster-whisper librosa
      - run: python pipeline/voice_compare.py out/voices
      - run: cat out/voices/results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: french-voices
          path: out/voices
          retention-days: 30
