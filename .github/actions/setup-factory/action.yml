name: Set up the What If Bix factory
description: Node, Python, ffmpeg, Chrome deps, npm/pip packages and the Piper voice (cached).
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - name: System packages (ffmpeg + headless Chrome libraries)
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev \
          libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
        sudo apt-get install -y -q libasound2t64 || sudo apt-get install -y -q libasound2
    - shell: bash
      run: npm ci
    - shell: bash
      run: pip install -r requirements.txt
    - uses: actions/cache@v4
      with:
        path: models/piper
        key: piper-voice-en-us-libritts-high-v1
    - name: Fetch Piper voice
      shell: bash
      run: bash pipeline/fetch_voice.sh en-us-libritts-high
    - name: Download Remotion's headless browser
      shell: bash
      run: npx remotion browser ensure
