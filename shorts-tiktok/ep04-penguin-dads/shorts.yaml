# TikTok-optimised Shorts for episode 4. Every claim comes from the episode's approved fact list.
episode: ep04-penguin-dads
shorts:
  - n: 1
    slug: no-food-four-months
    hook: "No food for 4 months"
    question: "Could your dad do this? 👇"
    tiktokCaption: "Emperor penguin dads can go about 115 days without food while keeping an egg warm on their feet 🐧 #penguins #animalfacts #antarctica #dads"
    youtubeTitle: "Penguin dads go 4 months without food"
    scenes:
      - like: the-fast
        narration: "Penguin dads go about four months without food."
        props:
          - { type: penguin, x: 1050, y: 860, s: 1.3, egg: true, mood: sleepy }
          - { type: calendar, at: 0, x: 1420, y: 420, from: 1, to: 115, dur: 2.2, label: "NO FOOD", s: 0.75, color: "#ff4d5e" }
        bix:
          - { at: 0, action: shock }
        texts: []
      - like: brood-pouch
        narration: "An emperor dad keeps the egg on his feet, under a warm fold of belly skin, through the Antarctic winter."
        props:
          - { type: penguin, x: 1100, y: 860, s: 1.6, egg: true }
          - { type: arrow, at: "@belly", from: [1450, 600], to: [1170, 790], color: "#ffd447", label: "brood pouch", labelX: 1480, labelY: 560 }
        bix:
          - { at: 0, action: point }
          - { at: "@winter", action: scared }
        texts:
          - { at: "@winter", text: "ANTARCTIC WINTER", style: label, color: "#7fd3ff" }
      - like: the-fast
        narration: "Counting the walk and courtship, he can go about {115 days|one hundred fifteen days} without eating, and lose up to around {40 percent|forty percent} of his body weight. So yes:"
        props:
          - { type: penguin, x: 1050, y: 860, s: 1.3, egg: true, mood: sleepy }
          - { type: gauge, at: "@40 percent", x: 1450, y: 600, r: 120, from: 0, to: 40, max: 100, dur: 1.0, label: "% weight lost" }
        bix:
          - { at: 0, action: think }
          - { at: "@115 days", action: shock }
          - { at: "@40 percent", action: facepalm }
        texts:
          - { at: "@115 days", until: "@40 percent", text: "115 DAYS", style: shout, rotate: -5 }
      - like: the-fast
        narration: "really."
        props:
          - { type: penguin, x: 1050, y: 860, s: 1.3, egg: true, mood: sleepy }
          - { type: calendar, at: 0, x: 1420, y: 420, from: 115, to: 115, dur: 0.1, label: "NO FOOD", s: 0.75, color: "#ff4d5e" }
        bix:
          - { at: 0, action: shock }
        texts: []

  - n: 2
    slug: penguin-sauna
    hook: "A 20 °C sauna in Antarctica"
    question: "Edge or middle: where are you? 👇"
    tiktokCaption: "Thousands of emperor penguin dads huddle through the winter, and inside it can get warmer than 20 °C 🐧🔥 #penguins #animalfacts #antarctica #science"
    youtubeTitle: "Penguins built a 20 °C sauna in Antarctica"
    scenes:
      - like: huddle
        narration: "Penguins have a sauna in Antarctica."
        props:
          - { type: huddle, x: 1150, y: 900, w: 720, h: 170, count: 34, heat: true, wave: 0 }
        bix:
          - { at: 0, action: shock }
        texts: []
      - like: huddle
        narration: "It's called a huddle. Thousands of males squeeze together, and inside, it can climb above {20 degrees|twenty degrees} Celsius. Warmer than many living rooms."
        props:
          - { type: huddle, x: 1150, y: 900, w: 720, h: 170, count: 34, heat: true, wave: 0 }
        bix:
          - { at: 0, action: point }
          - { at: "@20 degrees", action: shock }
          - { at: "@living", action: cheer }
        texts:
          - { at: "@20 degrees", text: "INSIDE: 20 °C+", style: big }
      - like: huddle-wave
        narration: "And nobody hogs the middle forever. Every 30 to 60 seconds, the whole huddle shuffles forward a few centimeters. In the middle of the Antarctic winter,"
        props:
          - { type: huddle, x: 1150, y: 900, w: 720, h: 170, count: 34, heat: true, wave: 3 }
        bix:
          - { at: 0, action: think }
          - { at: "@shuffles", action: laugh }
          - { at: "@winter", action: present }
        texts:
          - { at: "@shuffles", text: "SHUFFLE!", style: shout, rotate: -5 }
      - like: huddle
        narration: "these guys"
        props:
          - { type: huddle, x: 1150, y: 900, w: 720, h: 170, count: 34, heat: true, wave: 0 }
        bix:
          - { at: 0, action: point }
        texts: []

  - n: 3
    slug: penguin-dad-milk
    hook: "Penguin dads can make “milk”"
    question: "Best animal dad? Vote 👇"
    tiktokCaption: "Emperor penguin dads can feed a chick a milky secretion from the esophagus, after months without food 🐧 #penguins #animalfacts #dads #nature"
    youtubeTitle: "Penguin dads can make “milk” (sort of)"
    scenes:
      - like: penguin-milk
        narration: "Penguin dads can make milk. Sort of."
        props:
          - { type: penguin, x: 1100, y: 840, s: 1.4, chick: true }
          - { type: icon, icon: heart, at: 0, x: 1380, y: 420, s: 0.8 }
        bix:
          - { at: 0, action: shock }
          - { at: "@Sort", action: shrug }
        texts: []
      - like: penguin-milk
        narration: "If the chick hatches before Mom is back, Dad can feed it a rich, milky secretion made in his esophagus, sometimes called penguin milk."
        props:
          - { type: penguin, x: 1100, y: 840, s: 1.4, chick: true }
          - { type: arrow, at: "@esophagus", from: [1420, 520], to: [1150, 640], color: "#ff6fb5", label: "esophagus", labelX: 1440, labelY: 480 }
        bix:
          - { at: 0, action: present }
          - { at: "@milky", action: point }
          - { at: "@penguin", action: shock }
        texts:
          - { at: "@penguin", text: "\"penguin milk\"", style: label, color: "#ff6fb5" }
      - like: the-fast
        narration: "And he does it after months without eating. Only when Mom returns do the parents swap, and Dad finally walks to the sea to eat. So, yes,"
        props:
          - { type: penguin, x: 1050, y: 860, s: 1.3, egg: true, mood: sleepy }
        bix:
          - { at: 0, action: think }
          - { at: "@months", action: shock }
          - { at: "@swap", action: cheer }
        texts:
          - { at: "@months", until: "@swap", text: "MONTHS. NO FOOD.", style: shout, rotate: -5 }
          - { at: "@swap", text: "MOM'S BACK!", style: label, color: "#22d3c5" }
      - like: penguin-milk
        narration: "really:"
        props:
          - { type: penguin, x: 1100, y: 840, s: 1.4, chick: true }
          - { type: icon, icon: heart, at: 0, x: 1380, y: 420, s: 0.8 }
        bix:
          - { at: 0, action: point }
        texts: []
