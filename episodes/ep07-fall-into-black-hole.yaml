sources:
  - "NASA Science, What happens when something gets too close to a black hole? (spaghettification; small vs supermassive black holes): https://science.nasa.gov/universe/black-holes/what-happens-when-something-gets-too-close-to-a-black-hole/"
  - "NASA, What are black holes? (nothing, not even light, escapes from inside the event horizon): https://www.nasa.gov/universe/what-are-black-holes/"
  - "NASA Imagine the Universe, Black holes (Schwarzschild radius of the Sun ≈ 3 km): https://imagine.gsfc.nasa.gov/science/objects/black_holes2.html"
  - "NASA Imagine the Universe, If the Sun became a black hole, Earth's orbit would not change: https://imagine.gsfc.nasa.gov/educators/blackholes/imagine/page26.html"
  - "ESO / EHT, Astronomers capture first image of a black hole (M87*, ~55 million light-years, ~6.5 billion solar masses, 2019): https://www.eso.org/public/news/eso1907/"
  - "ESO / EHT, Astronomers reveal first image of the black hole at the heart of our galaxy (Sgr A*, ~27,000 light-years, 2022): https://www.eso.org/public/news/eso2208-eht-mw/"
  - "Event Horizon Telescope Collaboration (2022). First Sagittarius A* EHT results I. ApJL 930, L12 (~4 million solar masses): https://doi.org/10.3847/2041-8213/ac6674"
  - "NASA HEASARC, Sgr A* imaged by the EHT (the dark centre would fit within Mercury's orbit): https://heasarc.gsfc.nasa.gov/docs/objects/heapow/archive/compact_objects/sgra_eht.html"
  - "NASA Science / Hubble, Death spiral around a black hole (outside observers see infalling matter redden, dim and seem to freeze): https://science.nasa.gov/missions/hubble/death-spiral-around-a-black-hole-yields-tantalizing-evidence-of-an-event-horizon/"
  - "ESA, Gaia discovers a new family of black holes (Gaia BH1, ~1,560 light-years): https://www.esa.int/Science_Exploration/Space_Science/Gaia/Gaia_discovers_a_new_family_of_black_holes"
  - "Abbott, B. P. et al. (LIGO & Virgo, 2016). Observation of Gravitational Waves from a Binary Black Hole Merger. Phys. Rev. Lett. 116, 061102 (GW150914: ~36 and ~29 solar masses; ~3 solar masses radiated; peak power above all visible stars): https://doi.org/10.1103/PhysRevLett.116.061102"
