  accent: 1
  background: { type: space, tint: blue }
  props:
    - { type: earth, x: 1050, y: 1250, r: 600, spin: 0.02, tilt: 0 }
    - { type: satellite, kind: station, x: 1000, y: 330, s: 1.0 }
  bix: { action: shock, x: 1640, y: 1230, scale: 2.4, facing: -1, t: 0.45 }

sources:
  - "Bancroft, R. W. (1966). Physiological Responses to Near-Vacuum. ASTM STP (≈ 9–15 s of useful consciousness; animal exposures): https://doi.org/10.1520/STP46440S"
  - "Bancroft, R. W. & Dunn, J. E. (1965). Experimental animal decompressions to a near-vacuum environment. SAM-TR-65-48, NASA Technical Reports Server (dogs recovered from ~90 s–2 min exposures): https://ntrs.nasa.gov/citations/19660005051"
  - "FAA, Hypoxia and time of useful consciousness: https://www.faa.gov/pilots/training/airman_education/topics_of_interest/hypoxia"
  - "Murray, D. H. et al. (2013). Pathophysiology, prevention, and treatment of ebullism. Aviat. Space Environ. Med. 84(2), 89–96 (swelling, skin holds the body together, short exposures likely survivable): https://doi.org/10.3357/ASEM.3468.2013"
  - "Armstrong limit (≈ 6.3 kPa, ≈ 19 km; exposed body fluids boil at 37 °C, blood is protected by blood pressure): https://en.wikipedia.org/wiki/Armstrong_limit"
