# What If Bix — Episode 9 (Bix 2.0)
# Structure: the vanishing (how many insects there are), then one day after another: pollination (what we'd
# keep and what we'd lose), the food chain (birds), decomposition (dung), human health (a modelling estimate),
# and the twist: insect numbers are already falling in some places. Teaser: "See like a bee" (backlog).
# Every number is from the sources at the bottom; uncertain numbers are said with "about" / "scientists estimate".
id: ep09-insects-disappear
number: 9
title: "What if all the insects disappeared?"
description: |
  Tonight, every insect on Earth vanishes. No more mosquitoes... but also no more bees, beetles or butterflies.
  Bix follows what happens next: which foods we'd lose and which we'd keep, the birds left hungry, the dung that piles up, and why scientists are already watching insect numbers closely.
pinnedQuestion: "Which insect would YOU miss the most?"
hashtags: ["#insects", "#bees", "#nature", "#science"]
tags: [what if all the insects disappeared, insects, bees, pollination, pollinators, dung beetles, insect decline, food chain, biodiversity, ecology, what if bix]
lengthRange: [225, 270]
character: bix2
voice: { provider: piper, model: en-us-libritts-high, speaker: 92, lengthScale: 1.05 }
music: { style: curious, gain: 0.2, duck: 0.55, seed: 909 }
introAfter: how-many
outro:
  narration: "Which insect would you miss the most? Tell me in the comments. Next time: what if you could see like a bee, with colours we can't even imagine? Subscribe, so you don't miss it."
  background: { type: land, mood: sunset }

scenes:
  - id: cold-open
    chapter: "Tonight, they vanish"
    background: { type: land, mood: day }
    bixStart: [420, 820]
    props:
      - { type: flower, x: 1250, y: 820, count: 4, gap: 170 }
      - { type: bee, x: 1100, y: 460, s: 0.9, vanishAt: "@vanishes" }
      - { type: bee, x: 1400, y: 380, s: 0.8, facing: -1, seed: 2, vanishAt: "@vanishes" }
    bix:
      - { at: 0, action: present }
      - { at: "@vanishes", action: shock }
    texts:
      - { at: 0.1, text: "NO MORE INSECTS?!", style: title, y: 160 }
    narration: "Tonight, every insect on Earth *vanishes*. Goodbye mosquitoes! Great news, right? Well... let's see what happens next."

  - id: how-many
    background: { type: land, mood: day }
    bixStart: [420, 820]
    props:
      - { type: badge, at: "@quintillion", x: 1250, y: 420, r: 150, text: "10¹⁹", color: "#ffd447" }
    bix:
      - { at: 0, action: think }
      - { at: "@quintillion", action: shock }
    texts:
      - { at: "@zeros", text: "1 FOLLOWED BY 19 ZEROS", style: label, x: 1250, y: 170, color: "#8a5cff" }
    narration: "And that's a lot of insects. The Smithsonian estimates that about ten *quintillion* insects are alive at any one time. That's a one followed by nineteen *zeros*."

  - id: species
    chapter: "How many kinds?"
    transition: whip
    background: { type: lab }
    bixStart: [330, 820]
    props:
      - { type: bars, at: "@named", x: 1200, y: 800, w: 640, h: 420, values: [1, 5.5], display: ["≈ 1 million", "≈ 5.5 million"], labels: ["named", "estimated"], colors: ["#22d3c5", "#8a5cff"] }
    bix:
      - { at: 0, action: present }
      - { at: "@named", action: point }
      - { at: "@undiscovered", action: shock }
    narration: "Scientists have *named* about a million insect species. But they estimate there are about five and a half million in total. So most of the insects that would vanish are still *undiscovered*."

  - id: pollination
    chapter: "Day one: the flowers"
    transition: whip
    background: { type: land, mood: day }
    bixStart: [380, 820]
    props:
      - { type: flower, x: 1250, y: 820, count: 5, gap: 160, wiltAt: "@pollinate" }
      - { type: bee, x: 1250, y: 420, s: 1.0, vanishAt: 0.4 }
    bix:
      - { at: 0, action: present }
      - { at: "@pollinate", action: scared }
    texts:
      - { at: "@nine", text: "≈ 9 IN 10 FLOWERING PLANTS", style: label, x: 1250, y: 170, color: "#ff6fb5" }
    narration: "The first problem is flowers. Scientists estimate that nearly *nine* in ten flowering plant species rely on animals, mostly insects, to *pollinate* them. That's around 308,000 species. No visitors, no seeds, no fruit."

  - id: crops
    chapter: "What would we still eat?"
    transition: iris
    background: { type: land, mood: day }
    bixStart: [380, 820]
    props:
      - { type: board, at: "@three-quarters", x: 1250, y: 300, w: 720, h: 300, title: "Leading food crop types", size: 44, step: 0.9, lines: ["≈ 3/4 benefit from pollinators", "but ≈ 1/3 of the harvest by weight"] }
    bix:
      - { at: 0, action: present }
      - { at: "@three-quarters", action: point }
      - { at: "@third", action: think }
    narration: "What about our food? About *three-quarters* of the world's leading food crop types benefit at least partly from animal pollination. But by weight, those crops make up only about a *third* of what we grow. In money, scientists estimate pollinators help produce crops worth about 235 to 577 billion US dollars, every single year."

  - id: staples
    background: { type: land, mood: day, seaEnd: 0 }
    bixStart: [380, 820]
    props:
      - { type: icon, icon: check, x: 1000, y: 420, s: 1.4, at: "@wheat" }
      - { type: icon, icon: cross, x: 1500, y: 420, s: 1.4, at: "@lose" }
    bix:
      - { at: 0, action: present }
      - { at: "@wheat", action: cheer }
      - { at: "@lose", action: facepalm }
    texts:
      - { at: "@wind", text: "WIND-POLLINATED: STILL HERE", style: label, x: 1000, y: 170, color: "#3fcf6e" }
    narration: "Why so little? Because staple grains like *wheat*, rice and maize are pollinated by the *wind*, or pollinate themselves. So we'd still have bread and rice. But we'd *lose* much of the variety: many fruits, vegetables, nuts and seeds."

  - id: chocolate
    background: { type: lab }
    bixStart: [330, 820]
    props:
      - { type: badge, x: 1250, y: 500, r: 140, text: "COCOA", color: "#c98a45", rot: -6 }
      - { type: icon, icon: heart, x: 1550, y: 330, s: 1.2, at: "@midges" }
    bix:
      - { at: 0, action: present }
      - { at: "@chocolate", action: shock }
      - { at: "@midges", action: point }
    texts:
      - { at: "@chocolate", text: "NO CHOCOLATE?!", style: shout, x: 1250, y: 230, rotate: -5 }
    narration: "And brace yourself: *chocolate*. Cocoa flowers are pollinated mainly by tiny flies called *midges*, no bigger than a pinhead. No midges, no cocoa beans."

  - id: almonds
    background: { type: land, mood: day }
    bixStart: [380, 820]
    props:
      - { type: tree, x: 1100, y: 820, s: 1.0 }
      - { type: tree, x: 1400, y: 820, s: 0.9 }
      - { type: vehicle, kind: bus, from: [2300, 822], to: [1700, 822], at: "@trucked", dur: 2.5, color: "#ffd447" }
    bix:
      - { at: 0, action: present }
      - { at: "@million", action: shock }
    texts:
      - { at: "@million", text: "≈ 2 MILLION HIVES", style: big, x: 1250, y: 230 }
    narration: "Farmers know how much they need bees. Every spring, about two *million* honeybee hives are brought to California's almond orchards, many of them *trucked* in from across the United States."

  - id: by-hand
    chapter: "Pollinating by hand"
    transition: whip
    background: { type: land, mood: day }
    bixStart: [380, 820]
    props:
      - { type: pal, x: 1150, y: 820, s: 0.8, facing: -1, seed: 4, actions: [{ at: 0, action: point }] }
      - { type: flower, x: 1450, y: 820, count: 2, gap: 160 }
    bix:
      - { at: 0, action: present }
      - { at: "@hand", action: shock }
    narration: "Could people do the bees' job? It has happened. In parts of Sichuan, in China, where heavy pesticide use helped wipe out local bees, farmers have pollinated apple and pear blossoms by *hand*. Flower, by flower, by flower. In one county there, around 2001, nearly all the apple trees were pollinated by people. Slow, tiring work that bees do for free."

  - id: birds
    chapter: "Day two: hungry birds"
    transition: iris
    background: { type: sky, mood: day, speed: 40 }
    bixStart: [380, 820]
    props:
      - { type: bird, kind: pigeon, from: [-200, 330], to: [2200, 360], at: 0, dur: 5, s: 1.0 }
      - { type: bird, kind: duck, from: [-300, 480], to: [2200, 430], at: 1, dur: 6, s: 0.8 }
    bix:
      - { at: 0, action: present }
      - { at: "@million", action: shock }
    texts:
      - { at: "@million", text: "400–500 MILLION TONNES / YEAR", style: label, x: 1150, y: 170, color: "#ff7a1a" }
    narration: "Next, the animals that eat insects. Scientists estimate that the world's insect-eating birds eat about 400 to 500 *million* tonnes of insects and other small creepy-crawlies every year. Researchers compared it to the energy a city the size of New York uses in a year. Without insects, many birds, frogs and fish would go hungry."

  - id: dung
    chapter: "Day three: the dung piles up"
    transition: whip
    background: { type: land, mood: day }
    bixStart: [380, 820]
    props:
      - { type: beetle, x: 1250, y: 820, s: 1.1, facing: -1, from: [1500, 820], to: [1150, 820], moveAt: 0, dur: 4 }
    bix:
      - { at: 0, action: present }
      - { at: "@bury", action: point }
      - { at: "@rot", action: facepalm }
    narration: "And then, the mess. Insects are part of nature's clean-up crew. Dung beetles, for example, break up animal dung and *bury* it back into the soil, where it feeds the ground. Without them, dung can sit on the surface, *rot* slowly, and become a home for flies."

  - id: australia
    background: { type: land, mood: sunset }
    bixStart: [380, 820]
    props:
      - { type: beetle, x: 1250, y: 820, s: 1.1, facing: -1 }
      - { type: badge, at: "@CSIRO", x: 1650, y: 330, r: 100, text: "1960s", color: "#ffd447" }
    bix:
      - { at: 0, action: present }
      - { at: "@cow", action: laugh }
      - { at: "@CSIRO", action: point }
    narration: "Australia learned this the hard way. Its native dung beetles evolved with kangaroo droppings, and couldn't cope with big *cow* pats. So from the late 1960s, scientists at *CSIRO* brought in dozens of dung beetle species from Africa and Europe to bury the dung."

  - id: health
    chapter: "And us?"
    transition: iris
    background: { type: lab }
    bixStart: [330, 820]
    props:
      - { type: board, at: "@modelling", x: 1150, y: 330, w: 720, h: 260, title: "One modelling study", size: 44, step: 0.8, lines: ["no animal pollinators:", "≈ 1.4 million extra deaths a year"] }
    bix:
      - { at: 0, action: think }
      - { at: "@modelling", action: point }
      - { at: "@million", action: scared }
    narration: "For people, it's not instant famine, but it's serious. One *modelling* study estimated that losing all animal pollinators could lead to about 1.4 *million* extra deaths a year, from heart disease, strokes, some cancers and missing nutrients, because healthy fruits and vegetables would become scarce."

  - id: already
    chapter: "It's already happening"
    transition: whip
    background: { type: land, mood: day }
    bixStart: [380, 820]
    props:
      - { type: bars, at: "@three-quarters", x: 1250, y: 820, w: 620, h: 420, values: [100, 24], display: ["1989", "2016"], labels: ["then", "27 years later"], colors: ["#3fcf6e", "#ff4d5e"] }
    bix:
      - { at: 0, action: present }
      - { at: "@three-quarters", action: shock }
    texts:
      - { at: "@three-quarters", text: "≈ 76% FEWER (BY WEIGHT)", style: label, x: 1250, y: 170, color: "#ff4d5e" }
    narration: "Here's the twist: insects don't need to vanish overnight to matter. In German nature reserves, the weight of flying insects caught in traps fell by about *three-quarters* over twenty-seven years, measured at sixty-three sites. In mid-summer, the drop was even bigger: about eighty-two percent. That's one region, not the whole world, but scientists are watching closely."

  - id: lab-ending
    chapter: "Thank an insect"
    transition: whip
    background: { type: lab }
    bixStart: [420, 820]
    props:
      - { type: cactus, x: 1450, y: 760, s: 1.1, mood: happy, at: 0 }
      - { type: bee, x: 1100, y: 360, s: 1.2, at: "@bee" }
      - { type: flower, x: 1150, y: 820, count: 2, gap: 200, at: "@flowers" }
    bix:
      - { at: 0, action: present }
      - { at: "@flowers", action: point }
      - { at: "@bee", action: cheer }
    narration: "So, a world without insects? Fewer *flowers*, hungrier birds, dung everywhere, and much less fruit on your plate. Next time you see a *bee*, maybe say thanks. Even Newton agrees. He's a cactus. He knows how hard it is to find a pollinator in the desert."

