sources:
  - "NPR (2024), 'Lessons from sleeplessness: the 60th anniversary of Randy Gardner's world record' — ~264 hours (11 days) awake, Dec 1963–Jan 1964, age 17, observed by William Dement; later insomnia: https://www.npr.org/2024/01/28/1227217274/sleep-deprivation-record"
  - "Guinness World Records stopped monitoring sleep-deprivation attempts on health grounds (summary with citations): https://en.wikipedia.org/wiki/Randy_Gardner_(record_holder)"
  - "CDC / NIOSH — 24 hours awake impairs about like a 0.10% blood alcohol concentration; U.S. legal limit 0.08%: https://archive.cdc.gov/www_cdc_gov/niosh/emres/longhourstraining/impaired.html"
  - "NHLBI (NIH) — Sleep deprivation and deficiency, including microsleep: https://www.nhlbi.nih.gov/health/sleep-deprivation"
  - "NHTSA — Drowsy driving (police-reported deaths in the hundreds per year; widely considered an undercount). Distance: 100 km/h = 27.8 m/s, × 4 s ≈ 111 m: https://www.nhtsa.gov/risky-driving/drowsy-driving"
  - "Yoo, Gujar, Hu, Jolesz & Walker (2007), 'The human emotional brain without sleep — a prefrontal amygdala disconnect', Current Biology 17(20) — ~60% greater amygdala reactivity: https://doi.org/10.1016/j.cub.2007.08.007"
  - "Waters, Chiu, Atkinson & Blom (2018), 'Severe sleep deprivation causes hallucinations and a gradual progression toward psychosis with increasing time awake', Frontiers in Psychiatry — review of 21 studies: https://doi.org/10.3389/fpsyt.2018.00303"
  - "Prather, Janicki-Deverts, Hall & Cohen (2015), 'Behaviorally assessed sleep and susceptibility to the common cold', SLEEP 38(9) — <6 h sleepers ~4.2× more likely to develop a cold vs >7 h: https://doi.org/10.5665/sleep.4968"
  - "Rechtschaffen & Bergmann (2002), 'Sleep deprivation in the rat: an update of the 1989 paper', SLEEP 25(1):18–24 — totally sleep-deprived rats died within ~2–3 weeks, with increased food intake, weight loss and falling body temperature: https://doi.org/10.1093/sleep/25.1.18"
  - "University of Chicago News — Allan Rechtschaffen, sleep research pioneer (1927–2021): https://news.uchicago.edu/story/allan-rechtschaffen-sleep-research-pioneer-1927-2021"
  - "NIH GARD — Fatal familial insomnia (inherited prion disease affecting the thalamus): https://rarediseases.info.nih.gov/diseases/6429/fatal-familial-insomnia"
  - "Xie et al. (2013), 'Sleep drives metabolite clearance from the adult brain', Science 342:373–377 — ~60% larger interstitial space in sleep, faster β-amyloid clearance: https://doi.org/10.1126/science.1241224"
  - "NIH News (2013), 'Brain may flush out toxins during sleep': https://www.nih.gov/news-events/news-releases/brain-may-flush-out-toxins-during-sleep"
  - "NIGMS (NIH) — Circadian rhythms fact sheet: https://nigms.nih.gov/education/fact-sheets/Pages/circadian-rhythms.aspx"
  - "CDC — About sleep: adults need 7 or more hours per night: https://www.cdc.gov/sleep/about/index.html"
  - "Spiegel, Tasali, Penev & Van Cauter (2004), 'Brief communication: sleep curtailment in healthy young men is associated with decreased leptin levels, elevated ghrelin levels, and increased hunger and appetite', Annals of Internal Medicine 141(11) — after 2 nights of 4 h: leptin −18%, ghrelin +28%, hunger +24%: https://doi.org/10.7326/0003-4819-141-11-200412070-00008"
  - "Yoo, Hu, Gujar, Jolesz & Walker (2007), 'A deficit in the ability to form new human memories without sleep', Nature Neuroscience 10:385–392 — ~40% deficit in hippocampal encoding after one night of deprivation: https://doi.org/10.1038/nn1851"
