# MarMila — Épisode 3 (français)
# Suite de l'épisode 2 : le Docteur Méga (personnage 100 % fictif) dans une prison fictive,
# « la Forteresse », inspirée des prisons de très haute sécurité. L'histoire montre comment
# fonctionnent les prisons modernes et les recherches. AUCUNE méthode d'évasion : le récit
# saute volontairement le « comment » et se concentre sur ce qui se passe après.
id: fr03-evasion-prison
number: 3
language: fr
channel: marmila
title: "Et si un génie s'évadait de la prison la plus sûre du monde ?"
description: |
  Le Docteur Méga, notre génie maléfique 100 % inventé, est enfermé dans la Forteresse, une prison de très haute sécurité. Un matin, sa cellule est vide.
  Comment il est sorti ? On ne le dira pas, et ce n'est pas le sujet. Le sujet, c'est tout ce qui se met en marche juste après : les comptages, les chiens au flair 50 fois meilleur que le nôtre, les caméras thermiques, Interpol… et pourquoi l'histoire d'Alcatraz finit presque toujours de la même façon.
tags: [et si, évasion, prison, haute sécurité, alcatraz, chien policier, caméra thermique, interpol, histoire fictive, marmila]
hashtags: ["#etsi", "#evasion", "#prison", "#science"]
pinnedQuestion: "À ton avis, combien de temps il tiendrait dehors ?"
character: bix2
music: { style: tense, gain: 0.18, duck: 0.55, seed: 303 }
introAfter: empty-cell
outro:
  narration: "Et toi, tu aurais parié sur qui : le génie, ou l'équipe ? Réponds en commentaire, et abonne-toi à MarMila pour le prochain et si."
  background: { type: night-city }

scenes:
  # ------------------------------------------------------------- ouverture
  - id: cold-open
    chapter: "La cellule est vide"
    background: { type: night-city, mood: night }
    bixStart: [420, 820]
    props:
      - { type: prison, x: 1250, y: 820, s: 1.0, alarmAt: "@vide", label: "LA FORTERESSE" }
    bix:
      - { at: 0, action: idle }
      - { at: "@vide", action: shock }
    texts:
      - { at: "@génie", text: "ET SI UN GÉNIE S'ÉVADAIT ?", style: title, y: 160 }
    camera: { zoom: [1.0, 1.05], focus: [1000, 560] }
    sfx:
      - { name: rumble, at: "@vide", gain: 0.5 }
    narration: "Six heures du matin. Prison de la Forteresse. Le gardien ouvre la cellule du génie le plus dangereux du monde. Et la cellule est… *vide*."

  - id: empty-cell
    background: { type: night-city, mood: night }
    bixStart: [420, 820]
    props:
      - { type: prison, x: 1250, y: 820, s: 1.0, alarmAt: 0 }
      - { type: icon, icon: question, x: 1250, y: 300, s: 1.4, at: "@comment" }
    bix:
      - { at: 0, action: scared }
      - { at: "@comment", action: shrug }
      - { at: "@après", action: point }
    narration: "Le Docteur Méga s'est évadé. *Comment* ? On ne le dira pas. Ce n'est pas un tuto, et de toute façon, ce n'est pas le plus intéressant. Le plus intéressant, c'est ce qui se passe *après*."

  # ------------------------------------------------------------- la forteresse
  - id: fortress
    chapter: "La Forteresse"
    transition: whip
    background: { type: land, mood: day }
    bixStart: [380, 820]
    props:
      - { type: prison, x: 1250, y: 820, s: 1.1, fences: 3 }
    bix:
      - { at: 0, action: present }
      - { at: "@couches", action: point }
    texts:
      - { at: "@couches", text: "DES COUCHES ET DES COUCHES", style: label, x: 1250, y: 200, color: "#8a5cff" }
    narration: "D'abord, la Forteresse. Elle s'inspire des vraies prisons de très haute sécurité, les « supermax ». La sécurité y est faite de *couches* : murs, grillages, tours, caméras, portes. Chaque couche suppose que la précédente peut lâcher."

  - id: cameras
    background: { type: city, mood: night }
    bixStart: [380, 820]
    props:
      - { type: building, x: 1250, y: 820, w: 520, h: 560, color: "#8b93ad" }
      - { type: icon, icon: check, x: 1100, y: 420, s: 1.0, at: "@caméras" }
      - { type: icon, icon: check, x: 1400, y: 420, s: 1.0, at: "@sas" }
    bix:
      - { at: 0, action: present }
      - { at: "@caméras", action: point }
      - { at: "@sas", action: think }
    narration: "À l'intérieur, des *caméras* regardent chaque couloir, jour et nuit. Les portes fonctionnent souvent comme un *sas* : la deuxième ne s'ouvre que quand la première est fermée. Et chaque mouvement de détenu est noté, minute par minute."

  - id: cell-life
    background: { type: plain, color: "#4a4f6e" }
    bixStart: [600, 820]
    props:
      - { type: clock, x: 1300, y: 380, r: 160, time: "6:00", speed: 3 }
      - { type: board, at: "@heures", x: 1300, y: 640, w: 640, h: 220, size: 42, step: 0.7, title: "Supermax", lines: ["≈ 23 h par jour en cellule", "meubles en béton"] }
    bix:
      - { at: 0, action: sit }
      - { at: "@heures", action: shock }
    texts:
      - { at: "@heures", text: "23 H / 24", style: big, x: 1300, y: 180 }
    narration: "Dans ce genre de prison, un détenu peut passer environ vingt-trois *heures* par jour seul dans sa cellule. Le lit, le bureau, même le tabouret sont souvent en béton, coulés dans le sol."

  - id: counts
    background: { type: plain, color: "#4a4f6e" }
    bixStart: [600, 820]
    props:
      - { type: pal, x: 1250, y: 820, s: 0.85, facing: -1, seed: 4, hold: clipboard, actions: [{ at: 0, action: present }, { at: "@manque", action: shock }] }
      - { type: icon, icon: warning, x: 1250, y: 330, s: 1.3, at: "@manque" }
    bix:
      - { at: 0, action: present }
      - { at: "@manque", action: point }
    narration: "Et les détenus sont *comptés* plusieurs fois par jour, et la nuit aussi. Un comptage qui ne tombe pas juste, et toute la prison se fige. C'est exactement ce qui vient de se passer. Il en *manque* un."

  # ------------------------------------------------------------- l'alerte
  - id: alarm
    chapter: "L'alerte"
    transition: whip
    background: { type: night-city }
    bixStart: [380, 820]
    props:
      - { type: prison, x: 1250, y: 820, s: 0.9, alarmAt: 0 }
      - { type: phone, x: 1700, y: 520, s: 0.9, screen: map, at: "@prévient" }
    bix:
      - { at: 0, action: scared }
      - { at: "@prévient", action: point }
    texts:
      - { at: "@cercle", text: "LE CERCLE SE REFERME", style: shout, x: 1150, y: 200, rotate: -4 }
    narration: "En quelques minutes, l'alerte part. Les gardiens bouclent la prison, puis les environs. La police, la gendarmerie, les gares, les frontières : on les *prévient* tous. Un *cercle* se forme autour de la prison, et il se resserre."

  # ------------------------------------------------------------- les chiens
  - id: dogs
    chapter: "Les chiens et leur super-flair"
    transition: whip
    background: { type: land, mood: day }
    bixStart: [380, 820]
    props:
      - { type: dog, x: 1250, y: 820, s: 1.1, facing: -1, sniff: true }
      - { type: pal, x: 1600, y: 820, s: 0.8, facing: -1, seed: 6, actions: [{ at: 0, action: idle }] }
    bix:
      - { at: 0, action: present }
      - { at: "@millions", action: shock }
    texts:
      - { at: "@millions", text: "300 MILLIONS vs 6 MILLIONS", style: label, x: 1250, y: 220, color: "#ff7a1a" }
    narration: "Premiers sur la piste : les chiens. Le nez d'un chien compte jusqu'à trois cents *millions* de récepteurs olfactifs. Le tien ? Environ six millions. Cinquante fois moins."

  - id: dogs-2
    background: { type: land, mood: day }
    bixStart: [380, 820]
    props:
      - { type: dog, x: 900, y: 820, s: 1.1, facing: 1, sniff: true, to: [1550, 820], moveAt: "@piste", dur: 2.5 }
    bix:
      - { at: 0, action: point }
      - { at: "@piste", action: run, from: [380, 820], to: [700, 820], dur: 1.6 }
    narration: "Chacun de nous laisse derrière lui une traînée invisible : de minuscules particules de peau, des odeurs. Pour un chien entraîné, c'est une *piste*, aussi claire qu'une ligne tracée au sol."

  # ------------------------------------------------------------- la nuit
  - id: dogs-3
    background: { type: land, mood: sunset }
    bixStart: [380, 820]
    props:
      - { type: dog, x: 1250, y: 820, s: 1.1, facing: -1, sniff: true }
      - { type: clock, x: 1600, y: 380, r: 120, time: "9:00", speed: 2 }
    bix:
      - { at: 0, action: present }
      - { at: "@heures", action: shock }
    narration: "Et cette piste ne s'efface pas tout de suite. Un bon chien pisteur peut la suivre des *heures* après le passage de quelqu'un. Le génie a beau avoir une longueur d'avance, son odeur, elle, traîne derrière."

  - id: thermal
    chapter: "La nuit ne cache plus rien"
    transition: iris
    background: { type: land, mood: night }
    bixStart: [380, 820]
    props:
      - { type: helicopter, x: 1250, y: 230, s: 1.0, thermal: true, at: 0 }
      - { type: tree, x: 1250, y: 820, s: 1.0 }
      - { type: ring, at: "@chaleur", x: 1250, y: 760, r: 60, color: "#ff7a1a" }
    bix:
      - { at: 0, action: scared }
      - { at: "@chaleur", action: point }
    texts:
      - { at: "@37", text: "37 °C", style: big, x: 1620, y: 560 }
    narration: "La nuit, le génie pense se cacher. Mais un corps humain est à environ {37 degrés|trente-sept degrés}. Il brille en infrarouge. Depuis un hélicoptère, une caméra thermique voit cette *chaleur*, même dans le noir complet."

  - id: thermal-2
    background: { type: land, mood: night }
    bixStart: [380, 820]
    props:
      - { type: helicopter, x: 1350, y: 230, s: 1.0, light: true, from: [1600, 230], to: [1150, 230], at: 0, dur: 3 }
    bix:
      - { at: 0, action: think }
      - { at: "@jamais", action: shrug }
    narration: "Et les équipes se relaient. Les chercheurs dorment, mangent, changent de quart. Le fugitif, lui, est seul. Il ne peut *jamais* vraiment se reposer."

  # ------------------------------------------------------------- tout le monde regarde
  - id: everyone
    chapter: "Tout le monde le cherche"
    transition: whip
    background: { type: city }
    bixStart: [380, 820]
    props:
      - { type: crowd, x: 1250, y: 820, w: 1000, count: 22, rows: 3, s: 0.42, seed: 9 }
      - { type: phone, x: 1250, y: 380, s: 1.0, screen: video, at: "@visage" }
    bix:
      - { at: 0, action: present }
      - { at: "@visage", action: point }
      - { at: "@témoin", action: laugh }
    narration: "Son *visage* passe aux infos, sur les téléphones, dans les gares. D'un coup, des millions de personnes deviennent des yeux. Il suffit d'un seul *témoin* qui le reconnaît dans une boulangerie. Un seul appel, et tout le dispositif converge."

  - id: interpol
    background: { type: space, tint: blue }
    bixStart: [380, 880]
    props:
      - { type: earth, x: 1150, y: 540, r: 280, spin: 0.08 }
      - { type: badge, at: "@rouge", x: 1600, y: 300, r: 110, text: "196", sub: "pays", color: "#ff4d5e" }
    bix:
      - { at: 0, action: present }
      - { at: "@rouge", action: shock }
    texts:
      - { at: "@rouge", text: "NOTICE ROUGE", style: shout, x: 1150, y: 200, rotate: -5 }
    narration: "Et s'il quitte le pays ? Interpol peut diffuser une notice *rouge* : une demande, envoyée aux polices de {196|cent quatre-vingt-seize} pays, de le localiser et de l'arrêter. La planète entière devient sa prison."

  # ------------------------------------------------------------- l'histoire
  - id: alcatraz
    chapter: "La leçon d'Alcatraz"
    transition: iris
    background: { type: ocean, horizon: 520 }
    bixStart: [380, 860]
    props:
      - { type: prison, x: 1250, y: 560, s: 0.6, label: "ALCATRAZ" }
      - { type: bars, at: "@quatorze", x: 1300, y: 840, w: 640, h: 170, values: [23, 6, 2, 5], labels: ["repris", "tués", "noyés", "disparus"], colors: ["#3fcf6e", "#ff4d5e", "#2f8cff", "#8b93ad"] }
    bix:
      - { at: 0, action: present }
      - { at: "@quatorze", action: point }
    texts:
      - { at: "@trente-six", text: "36 HOMMES, 14 TENTATIVES", style: label, x: 1250, y: 170, color: "#8a5cff" }
    narration: "L'histoire a déjà fait l'expérience. Pendant ses vingt-neuf ans de prison, Alcatraz a connu *trente-six* hommes et *quatorze* tentatives d'évasion. Vingt-trois ont été repris, six abattus, deux noyés. Cinq n'ont jamais été retrouvés, et sont portés disparus, sans doute noyés."

  - id: alcatraz-2
    background: { type: ocean, horizon: 520 }
    bixStart: [380, 860]
    props:
      - { type: wave, at: "@froide", h: 260, dur: 2.6, y: 900 }
    bix:
      - { at: 0, action: think }
      - { at: "@froide", action: scared }
    narration: "Sortir, c'est la partie que tout le monde imagine. Mais dehors, il reste l'eau *froide*, la faim, la fatigue, et le monde entier qui cherche. Les murs ne sont que la première couche. La plus visible, mais pas la plus difficile."

  - id: needs
    background: { type: city }
    bixStart: [380, 820]
    props:
      - { type: genius, x: 1250, y: 820, s: 0.9, facing: -1, actions: [{ at: 0, action: sleepy }] }
      - { type: board, at: "@besoin", x: 1250, y: 300, w: 640, h: 260, size: 44, step: 0.7, title: "Dehors, il doit…", lines: ["manger", "dormir", "se déplacer"] }
    bix:
      - { at: 0, action: present }
      - { at: "@besoin", action: point }
    narration: "Dehors, le temps joue contre lui. Il doit manger, dormir, se déplacer. Et chaque *besoin* est une occasion d'être vu. Le génie peut tout calculer… sauf la faim."

  # ------------------------------------------------------------- la fin
  - id: caught-again
    chapter: "Le génie et l'équipe"
    transition: whip
    background: { type: night-city }
    bixStart: [380, 820]
    props:
      - { type: genius, x: 1250, y: 820, s: 0.9, facing: -1, actions: [{ at: 0, action: sleepy }, { at: "@repris", action: facepalm }] }
      - { type: dog, x: 1550, y: 820, s: 0.9, facing: -1, sniff: true }
      - { type: helicopter, x: 1250, y: 230, s: 0.85, light: true }
    bix:
      - { at: 0, action: present }
      - { at: "@repris", action: cheer }
    texts:
      - { at: "@repris", text: "REPRIS !", style: shout, x: 1250, y: 430, rotate: -6 }
    narration: "Trois jours plus tard, épuisé, affamé, reconnu par un chauffeur de bus, le Docteur Méga est *repris*. Sans un coup de feu. Juste par une équipe qui ne s'est jamais arrêtée."

  - id: moral
    background: { type: lab }
    bixStart: [400, 820]
    props:
      - { type: cactus, x: 1450, y: 760, s: 1.1, mood: happy, at: 0 }
    bix:
      - { at: 0, action: present }
      - { at: "@coup", action: laugh }
    narration: "Le vrai coup de génie, au fond, ça aurait été de ne jamais finir en prison. Un cerveau comme le sien aurait pu soigner, inventer, construire. Ça, c'est le seul plan qui marche à tous les coups. Et toi, tu aurais choisi quel camp ?"

