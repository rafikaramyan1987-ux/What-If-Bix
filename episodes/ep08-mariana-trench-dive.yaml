# What If Bix — Episode 8 (Bix 2.0)
# Structure: a dive, floor by floor (light fades -> midnight zone -> the fish limit -> the bottom), the
# pressure, the first dive (Trieste, 1960), what lives at the bottom, what humans left there, the later
# dives, and a teaser for episode 9. Every number is from the sources at the bottom (NOAA first).
id: ep08-mariana-trench-dive
number: 8
title: "What if you dove to the bottom of the Mariana Trench?"
description: |
  Eleven kilometres of water above your head, total darkness, and over a thousand times the pressure you feel right now.
  Bix dives to Challenger Deep: the light that disappears, the fish that can't go deeper, the first dive in 1960, the strange animals at the bottom, and what humans already left down there.
pinnedQuestion: "Would YOU get in the submarine?"
hashtags: ["#ocean", "#deepsea", "#science", "#whatif"]
tags: [what if you dove to the bottom of the mariana trench, mariana trench, challenger deep, deep sea, ocean pressure, trieste, snailfish, amphipod, deep ocean, ocean science, what if bix]
lengthRange: [225, 270]
character: bix2
voice: { provider: piper, model: en-us-libritts-high, speaker: 92, lengthScale: 1.05 }
music: { style: dreamy, gain: 0.2, duck: 0.55, seed: 808, loudnorm: two-pass }
introAfter: how-deep
outro:
  narration: "Would you get in the submarine? Tell me in the comments. Next time: what if every insect on Earth suddenly vanished? You might be surprised who'd miss them most. Subscribe."
  background: { type: ocean, horizon: 300, mood: night }

scenes:
  - id: cold-open
    chapter: "Eleven kilometres down"
    background: { type: plain, color: "#071633" }
    bixStart: [380, 880]
    bixScale: 0.85
    props:
      - { type: sub, x: 1150, y: 420, s: 1.0, light: true }
    bix:
      - { at: 0, action: scared }
      - { at: "@crush", action: shock }
    texts:
      - { at: 0.1, text: "11 KM DOWN?!", style: title, y: 160 }
    camera: { zoom: [1.0, 1.06], focus: [960, 540] }
    narration: "You're sinking. Above you, about eleven kilometres of water. Around you, total darkness. And a pressure more than a thousand times stronger than up here, ready to *crush* anything not built for it."

  - id: how-deep
    background: { type: ocean, horizon: 300 }
    bixStart: [380, 860]
    bixScale: 0.85
    props:
      - { type: bars, at: "@Everest", x: 1250, y: 860, w: 700, h: 520, values: [8849, 10935], display: ["8,849 m", "≈ 10,935 m"], labels: ["Everest", "Challenger Deep"], colors: ["#8b93ad", "#2f8cff"] }
    bix:
      - { at: 0, action: present }
      - { at: "@Everest", action: point }
      - { at: "@underwater", action: shock }
    narration: "Welcome to the Mariana Trench, in the Pacific Ocean. Its deepest spot, Challenger Deep, is about 10,935 metres down. Drop Mount *Everest* in, and its peak would still be about two kilometres *underwater*."

  - id: how-formed
    background: { type: ocean, horizon: 300 }
    bixStart: [380, 860]
    bixScale: 0.85
    props:
      - { type: arrow, at: "@dives", from: [1500, 520], to: [1150, 820], color: "#ff7a1a", bend: 30, label: "plate", labelX: 1400, labelY: 600 }
      - { type: board, at: "@long", x: 1250, y: 300, w: 640, h: 220, title: "Mariana Trench", size: 44, step: 0.8, lines: ["≈ 2,500 km long", "Pacific Ocean"] }
    bix:
      - { at: 0, action: present }
      - { at: "@dives", action: point }
      - { at: "@long", action: shock }
    narration: "How did such a hole form? Here, one huge piece of Earth's crust, a tectonic plate, *dives* underneath another one, and bends the sea floor down. The trench it leaves is about 2,500 kilometres *long*. A deep scar, hidden under the Pacific."

  - id: light-fades
    chapter: "Where the light ends"
    transition: whip
    background: { type: ocean, horizon: 120 }
    bixStart: [960, 560]
    props:
      - { type: sub, x: 1450, y: 400, s: 0.7 }
      - { type: board, at: "@200", x: 600, y: 330, w: 520, h: 220, title: "Light", size: 42, step: 0.8, lines: ["≈ 200 m: mostly gone", "≈ 1,000 m: pitch black"] }
    bix:
      - { at: 0, action: float }
      - { at: "@200", action: point }
      - { at: "@black", action: scared }
    narration: "As you sink, the sunlight fades fast. Most of it is gone by about *200* metres. Below about a thousand metres, it's pitch *black*. Scientists call it the midnight zone. And you're not even a tenth of the way down."

  - id: glow
    background: { type: plain, color: "#06122a" }
    bixStart: [380, 880]
    bixScale: 0.85
    props:
      - { type: confetti, at: "@light", dur: 6, count: 40 }
      - { type: snailfish, x: 1250, y: 480, s: 0.9, at: "@animals" }
    bix:
      - { at: 0, action: float }
      - { at: "@light", action: shock }
    texts:
      - { at: "@bioluminescence", text: "BIOLUMINESCENCE", style: label, x: 1250, y: 170, color: "#22d3c5" }
    narration: "But it's not completely dark everywhere. Many deep-sea *animals* make their own *light*, with chemistry inside their bodies. It's called *bioluminescence*. Flashes, glowing lures, even light used as camouflage."

  - id: pressure
    chapter: "The pressure"
    transition: iris
    background: { type: plain, color: "#071633" }
    bixStart: [380, 880]
    bixScale: 0.85
    props:
      - { type: gauge, x: 1250, y: 480, r: 180, from: 0, to: 98, max: 100, at: "@thousand", dur: 2.5, label: "pressure" }
    bix:
      - { at: 0, action: present }
      - { at: "@thousand", action: shock }
      - { at: "@tons", action: scared }
    texts:
      - { at: "@thousand", text: "> 1,000× SURFACE PRESSURE", style: label, x: 1250, y: 160, color: "#ff4d5e" }
    narration: "Now the real problem. Ever felt your ears hurt at the bottom of a swimming pool? That's just a few metres of water. At the bottom of the trench, the water pressure is more than a *thousand* times what you feel right now. That's about eight *tons* pressing on every square inch. Roughly like a big elephant standing on your thumb."

  - id: trieste
    chapter: "The first dive: 1960"
    transition: whip
    background: { type: ocean, horizon: 300 }
    bixStart: [380, 860]
    bixScale: 0.85
    props:
      - { type: sub, x: 1250, y: 400, s: 1.1, label: "TRIESTE", from: [1250, 300], to: [1250, 520], moveAt: 0, dur: 8 }
      - { type: badge, at: "@1960", x: 1700, y: 760, r: 100, text: "1960", color: "#ffd447" }
    bix:
      - { at: 0, action: present }
      - { at: "@1960", action: point }
    narration: "Humans first made it in January *1960*. Two explorers, Don Walsh and Jacques Piccard, sank to the bottom in a vessel called the Trieste. The trip down took almost five hours."

  - id: trieste-crack
    background: { type: plain, color: "#071633" }
    bixStart: [380, 880]
    bixScale: 0.85
    props:
      - { type: sub, x: 1250, y: 450, s: 1.1, label: "TRIESTE", light: true }
      - { type: crack, x: 1290, y: 560, w: 120, at: "@cracked" }
      - { type: boom, at: "@bang", x: 1290, y: 520 }
    bix:
      - { at: 0, action: think }
      - { at: "@bang", action: shock }
      - { at: "@minutes", action: cheer }
    texts:
      - { at: "@minutes", text: "≈ 20 MINUTES ON THE BOTTOM", style: label, x: 1250, y: 160, color: "#22d3c5" }
    narration: "On the way down, an outer window *cracked* with a loud *bang*. They kept going anyway. They spent about twenty *minutes* on the bottom, looking out into the dark, and then began the long climb back up to the surface."

  - id: fish-limit
    chapter: "Even fish give up"
    transition: iris
    background: { type: plain, color: "#06122a" }
    bixStart: [380, 880]
    bixScale: 0.85
    props:
      - { type: snailfish, x: 1250, y: 480, s: 1.2, from: [1550, 480], to: [1150, 480], moveAt: 0, dur: 4 }
    bix:
      - { at: 0, action: present }
      - { at: "@snailfish", action: point }
      - { at: "@deeper", action: shock }
    texts:
      - { at: "@8,336", text: "8,336 m", style: big, x: 1250, y: 220 }
    narration: "Here's something wild. Fish can't live all the way down. The deepest fish ever filmed was a small *snailfish*, at 8,336 metres, off Japan. Scientists think fish can't survive much *deeper* than about 8,200 to 8,400 metres."

  - id: fish-why
    background: { type: plain, color: "#06122a" }
    bixStart: [380, 880]
    bixScale: 0.85
    props:
      - { type: snailfish, x: 1250, y: 480, s: 1.2 }
      - { type: icon, icon: warning, x: 1250, y: 260, s: 1.2, at: "@water" }
    bix:
      - { at: 0, action: think }
      - { at: "@water", action: point }
    narration: "Why? To protect their cells from the pressure, deep fish load up on a special molecule. But the deeper they go, the more they need. Past a certain depth, scientists think their bodies would pull in too much *water*. So below that line: no fish."

  - id: bottom-life
    chapter: "Who lives at the bottom?"
    transition: whip
    background: { type: plain, color: "#050d20" }
    bixStart: [380, 880]
    bixScale: 0.85
    props:
      - { type: amphipod, x: 1250, y: 520, s: 1.0, count: 6, spread: 260 }
    bix:
      - { at: 0, action: present }
      - { at: "@amphipods", action: point }
    texts:
      - { at: "@amphipods", text: "AMPHIPODS", style: label, x: 1250, y: 170, color: "#ff7a1a" }
    narration: "But life doesn't stop. At the very bottom, scientists have found shrimp-like scavengers called *amphipods*, giant single-celled blobs called xenophyophores, and see-through sea cucumbers. Life, eleven kilometres down."

  - id: wood-eaters
    background: { type: plain, color: "#050d20" }
    bixStart: [380, 880]
    bixScale: 0.85
    props:
      - { type: amphipod, x: 1250, y: 520, s: 1.3 }
      - { type: tree, x: 1650, y: 820, s: 0.6, at: "@wood" }
    bix:
      - { at: 0, action: think }
      - { at: "@wood", action: shock }
      - { at: "@sugar", action: laugh }
    narration: "One of those amphipods even makes its own special enzyme that turns *wood* into *sugar*. So when bits of sunken plants drift down, dinner is served."

  - id: plastic
    chapter: "We got there first... with trash"
    transition: iris
    background: { type: plain, color: "#050d20" }
    bixStart: [380, 880]
    bixScale: 0.85
    props:
      - { type: icon, icon: warning, x: 1250, y: 450, s: 1.6, at: "@plastic" }
    bix:
      - { at: 0, action: present }
      - { at: "@plastic", action: facepalm }
      - { at: "@pollution", action: scared }
    texts:
      - { at: "@10,898", text: "10,898 m", style: big, x: 1250, y: 220 }
    narration: "And here's the sad part. A *plastic* bag was spotted almost eleven kilometres down, at 10,898 metres. And amphipods from the trench were found carrying human *pollution*, chemicals made in factories far away."

  - id: later-dives
    chapter: "Who else has been there?"
    transition: whip
    background: { type: ocean, horizon: 300 }
    bixStart: [380, 860]
    bixScale: 0.85
    props:
      - { type: sub, x: 1250, y: 420, s: 0.9, label: "2012" }
      - { type: timeline, at: "@2012", x: 1100, y: 800, w: 1100, marks: [{ pos: 0, label: "1960" }, { pos: 0.6, label: "2012" }, { pos: 0.88, label: "2019" }, { pos: 1, label: "2020" }] }
    bix:
      - { at: 0, action: present }
      - { at: "@2012", action: point }
      - { at: "@woman", action: cheer }
    narration: "Since then, more explorers have followed. In *2012*, filmmaker James Cameron made the first solo dive, reaching about 10,908 metres. In 2019, Victor Vescovo's sub, Limiting Factor, made several dives there. And in 2020, former astronaut Kathy Sullivan became the first *woman* to reach the bottom. She's also the first person to have walked in space and been to the deepest point of the ocean. From the top of the sky, to the bottom of the sea."

  - id: lab-ending
    chapter: "Would you go?"
    transition: whip
    background: { type: lab }
    bixStart: [420, 820]
    props:
      - { type: cactus, x: 1450, y: 760, s: 1.1, mood: shock, at: 0 }
      - { type: bee, x: 1150, y: 360, s: 1.2, at: "@insect" }
    bix:
      - { at: 0, action: present }
      - { at: "@suit", action: shrug }
      - { at: "@insect", action: shock }
    narration: "So let's recap. About eleven kilometres of water. More than a thousand times the pressure. No light, no fish at the bottom, but still life, and sadly, still our trash. So could you dive there? Only inside a very strong sub, built just for this. Without one, no diving *suit* could protect you. Next time, a smaller question with a huge answer: what if every *insect* on Earth disappeared?"

